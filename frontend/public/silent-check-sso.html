<html>
    <head>
        <meta charset="utf-8"/>
    </head>
    <body>
        <script>
            (function() {
                const originalPostMessage = parent.postMessage;

                try {
                    if (window.location.href) {
                        originalPostMessage.call(parent, window.location.href, window.location.origin);
                    }
                } catch (e) {
                    console.error("Silent SSO failed:", e);
                }
            })();
        </script>
    </body>
</html>
