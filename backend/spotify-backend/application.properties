server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8070/realms/raspberry
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/raspberry/protocol/openid-connect/certs

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.cloud.aws.credentials.access-key=${S3_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${S3_SECRET_KEY}
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.s3.endpoint=${S3_ENDPOINT}
spring.cloud.aws.s3.path-style-access-enabled=${S3_FORCE_PATH_STYLE:true}
spring.cloud.aws.s3.bucket=${S3_BUCKET}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.sql.init.mode=always
