server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8070/realms/raspberry
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/raspberry/protocol/openid-connect/certs

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.sql.init.mode=always
