version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: spotify-postgres-dev
    environment:
      POSTGRES_DB: spotify
      POSTGRES_USER: spotify
      POSTGRES_PASSWORD: spotify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotify -d spotify"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: spotify-seaweedfs-dev
    command:
      - server
      - -s3
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3.config=/etc/seaweedfs/s3-config.json
    ports:
      - "8333:8333" # s3 API
      - "9333:9333" # Master UI
      - "8888:8888" # Filer UI
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    healthcheck:
      test: ["CMD", "wget", "--timeout=3", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    container_name: spotify-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for SeaweedFS...";
        until wget -q --spider http://seaweedfs:9333/cluster/status; do sleep 2; done;
        echo "Creating bucket 'spotify-media'...";
        echo 's3.bucket.create -name=spotify-media' | weed shell -master=seaweedfs:9333
        echo "Bucket created"
    restart: "no"

  spotify-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: spotify-backend-dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    command: ./mvnw spring-boot:run -pl spotify-backend
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/spotify
      - SPRING_DATASOURCE_USERNAME=spotify
      - SPRING_DATASOURCE_PASSWORD=spotify
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=spotify_access_key
      - S3_SECRET_KEY=spotify_secret_key
      - S3_BUCKET=spotify-media
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully


  spotify-search-node:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: spotify-search-node-dev
    ports:
      - "8090:8090"
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    command: ./mvnw spring-boot:run -pl spotify-search-node
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/spotify
      - SPRING_DATASOURCE_USERNAME=spotify
      - SPRING_DATASOURCE_PASSWORD=spotify
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=spotify_access_key
      - S3_SECRET_KEY=spotify_secret_key
      - S3_BUCKET=spotify-media
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully


  spotify-frontend:
    image: node:20-alpine
    container_name: spotify-frontend-dev
    working_dir: /app
    ports:
      - "5100:5100"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_SEARCH_URL=http://localhost:8090

  keycloak:
    image: keycloak/keycloak:26.7
    container_name: keycloak-dev
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "http://localhost:8070"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
        - ./keycloak:/opt/keycloak/data/import/:ro
        - keycloak_data:/opt/keycloak/data/
    ports:
      - "8070:8080"

volumes:
  keycloak_data:
  postgres_data:
  seaweedfs_data:
