openapi: 3.0.3
info:
  title: Raspberry Spotify API
  version: 1.0.0
paths:
  /api/playlists/{id}:
    get:
      summary: Получить плейлист по id
      tags:
        - Playlists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Запрос успешно выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
    patch:
      summary: Обновить плейлист по id
      tags:
        - Playlists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistUpdateRequest'
      responses:
        '200':
          description: Плейлист успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
    delete:
      summary: Удалить плейлист по id
      tags:
        - Playlists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Плейлист был успешно удален
  /api/playlists:
    post:
      summary: Создать новый плейлист
      tags:
        - Playlists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistCreateRequest'
      responses:
        '200': 
          description: Плейлист успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
    get:
      summary: Получить все публичные плейлисты
      tags:
        - Playlists
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Кол-во элементов на странице
          required: false
          schema:
            type: integer 
            default: 20
        - name: sort
          in: query
          description: Параметр сортировки в формате `property,(asc|desc)`
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Запрос успешно выполнен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaylistResponse'
  /api/playlists/owner:
    get:
      summary: Получить все плейлисты авторизированного пользователя
      tags:
        - Playlists
      responses:
        '200':
          description: Запрос успешно выполнен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaylistResponse'

components:
  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: string
        keycloakId:
          type: string
    PlaylistCreateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]
    PlaylistUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]
    PlaylistResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]
          default: private
        owner:
          $ref: '#/components/schemas/UserResponse'


